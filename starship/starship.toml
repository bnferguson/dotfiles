# Prompt: newline, then directory + VCS info, then prompt char on next line
format = """
$battery$directory${custom.vcs}$cmd_duration
$character"""

add_newline = true

[battery]
full_symbol = "🔋"
charging_symbol = "⚡"
discharging_symbol = "🔋"

[[battery.display]]
threshold = 20
style = "bold red"

[[battery.display]]
threshold = 50
style = "bold yellow"

[directory]
truncation_length = 1
truncate_to_repo = false
style = "bold cyan"

[character]
success_symbol = "[›](bold)"
error_symbol = "[›](bold red)"

[cmd_duration]
min_time = 2_000
format = "took [$duration]($style) "
style = "yellow"

[ruby]
detect_files = ["Gemfile", ".ruby-version"]
format = "[$symbol($version)]($style) "

[golang]
detect_files = ["go.mod"]
format = "[$symbol($version)]($style) "

[nodejs]
detect_files = ["package.json", ".node-version"]
format = "[$symbol($version)]($style) "

[python]
detect_files = ["requirements.txt", "pyproject.toml", ".python-version"]
format = "[$symbol($version)]($style) "

# Keep native Git modules configured for prompt-vcs's fallback.
# Starship runs this custom command alongside other modules with a bounded timeout.
[custom.vcs]
when = 'git rev-parse --is-inside-work-tree >/dev/null 2>&1'
command = 'sh "$HOME/.dotfiles/bin/prompt-vcs"'
shell = ["sh"]
format = "[$output]($style) "
style = "bold purple"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
format = '([$all_status$ahead_behind]($style) )'
